name: "Deploy"

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm

            - name: Install
              run: npm ci

            - name: Check API URL
              run: |
                  if [ -z "$VITE_HANDWRITE_API_URL" ]; then
                      echo "::error::VITE_HANDWRITE_API_URL repository variable is not configured"
                      exit 1
                  fi
              env:
                  VITE_HANDWRITE_API_URL: ${{ vars.VITE_HANDWRITE_API_URL }}

            - name: Deploy
              run: |
                  git config user.name "GitHub Action"
                  git config user.email "github-action@github.com"
                  git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
                  npm run deploy
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VITE_HANDWRITE_API_URL: ${{ vars.VITE_HANDWRITE_API_URL }}
